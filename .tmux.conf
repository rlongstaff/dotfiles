# tmux.  Options live here; every key binding is in .tmux/keys.conf, GENERATED from
# keys.yaml by scripts/keyboard/render.sh, and every colour in .tmux/colors.conf, GENERATED
# from colors.yaml by scripts/colors/render.sh.  Rationale for the keys:
# docs/keyboard.md.  Restart tmux (tmux kill-server) after changing either file.

# -- status line -----------------------------------------------------------------------
set -g status-position top
set -g status-left "#{host_short} #{pane_index}"
set -g status-right "#[fg=#{@status-clock-fg}]%T"
# interval 1 should not be used with shell
set -g status-interval 1

# -- input -----------------------------------------------------------------------------
# Alt is the in-terminal command modifier and arrives as an ESC prefix.  escape-time 0
# means tmux never waits to decide between a lone Escape and a Meta key; extended-keys
# (CSI u) lets it tell Alt-[ from the start of an escape sequence.
set -s escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u

# -- mouse -----------------------------------------------------------------------------
# On: wheel scrollback, click-to-focus, drag-to-resize.  The cost is copy: tmux takes a
# plain drag, so the terminal has no selection for Cmd-C / Super-C to copy.  Hold Shift
# (Option in iTerm2) while dragging to get a terminal selection anyway, or Alt-m to turn
# mouse reporting off for as long as that is wanted.
set -g mouse on

# -- copy mode -------------------------------------------------------------------------
# tmux is deliberately not in the clipboard path: the terminal owns copy, because
# gnome-terminal (VTE) has no OSC 52.  Copy-mode still exists for scrollback beyond the
# screen; it copies to tmux's own buffer, pasted with C-x ].

# -- keys ------------------------------------------------------------------------------
# ~/.tmux is linked to the repo's .tmux, so this is the repo copy.  Not -F with
# #{current_file}: that needs tmux 3.2+, and on an older tmux the failed line would drop
# every binding.  -q: a missing fragment leaves tmux's defaults rather than an error.
source-file -q ~/.tmux/keys.conf

# -- colours ---------------------------------------------------------------------------
# Every colour (status line, selection, the clock's @status-clock-fg) is in
# .tmux/colors.conf, GENERATED from colors.yaml by scripts/colors/render.sh.
source-file -q ~/.tmux/colors.conf
