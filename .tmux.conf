set -g prefix C-x

set -g status-bg "#003366"
set -g status-fg white
set -g status-position top
# set -g status-left "#{host_short} win:#{window_index} pane:#{pane_index}"
set -g status-left "#{host_short} #{pane_index}"
set -g status-right "#[fg=green]%T"
# interval 1 should not be used with shell
set -g status-interval 1

#set -g xterm-keys on
set -g extended-keys on
#set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

# Mouse reporting is OFF by default, and that is a copy/paste decision.
#
# Copy is Cmd-C / Super-C, which the terminal emulator handles, and it copies the
# *terminal's* selection.  With 'mouse on' tmux consumes the drag, the terminal's
# selection stays empty, and the tier-1 gesture silently copies nothing.  With it off a
# plain drag is a terminal selection, so "drag, Cmd-C" works in a shell pane with no
# modifier on the drag and no Shift-bypass to remember.
#
# What that costs: wheel scrollback, click-to-focus and drag-to-resize.  Alt-m turns
# mouse reporting back on for as long as it is wanted, and off again -- one key, in the
# Alt layer where every other in-terminal command lives.  PageUp still enters copy-mode
# without it (see the scrollback bindings below).
set -g mouse on
bind -n M-m set -g mouse \; display "mouse #{?mouse,on -- Shift-drag to select,off -- drag to select}"

# Alt/Option is the in-terminal command modifier.  See keyboard/README.md: Cmd/Super has
# no byte encoding, so it never reaches tmux -- the terminal emulator consumes it.  Alt
# encodes as an ESC prefix, so it does reach here, and it is at the same finger position
# on every target keyboard (two left of space: Option on macOS, Alt after the xkb swap on
# Linux).
#
# Frequent operations are bound with -n (no prefix) so they are never chained.  C-x
# remains for everything rare.

# -- panes ---------------------------------------------------------------------------
# 'M-\' must be quoted: tmux has no BSlash key name, and an unquoted backslash is eaten
# by the config parser, so the binding silently never registers.
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M--   split-window -v -c "#{pane_current_path}"
bind -n M-z   resize-pane -Z
bind -n M-[   swap-pane -U
bind -n M-]   swap-pane -D
bind -n M-w   kill-pane

# old habits die hard
bind \\  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# -- windows -------------------------------------------------------------------------
bind -n M-n new-window -c "#{pane_current_path}"
# NOT M-[ / M-]: those transmit ESC-[ and ESC-], which are the CSI and OSC introducers.
# tmux cannot distinguish them from a real escape sequence.
bind -n M-, previous-window
bind -n M-. next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# -- focus, shared with vim splits ---------------------------------------------------
# M-h/j/k/l moves between tmux panes, except when the pane is running vim, where it is
# forwarded so vim can move between its own splits instead.  This is the vim-tmux-navigator
# behaviour without the plugin: one keystroke crosses both boundaries, which is the whole
# point of merging the pane and window concepts.
#
# The vim half lives in .vimrc.  If vim is not configured, the keys still move tmux panes
# everywhere except inside vim, which is a graceful floor rather than a break.
# Deliberately backslash-free.  This string is parsed by tmux, then handed to sh, then
# read by grep -- three layers, each with its own escaping.  A '\S' written here arrives
# at grep as a literal backslash and the test silently never matches.  Bracket
# expressions and '*' survive all three untouched.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +[^ ]*(vim|vimx|nvim|view)(-wrapped)?(diff)?$'"

bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# The cursor keys mirror h/j/k/l exactly, including the vim passthrough, so the two are
# interchangeable everywhere rather than only in vim's own normal mode.
#
# Note these arrive as a different encoding: Alt+letter is a plain ESC prefix, while
# Alt+Arrow is the xterm CSI form ESC [ 1 ; 3 <letter>.  tmux decodes both to M-<key>,
# so nothing extra is needed here -- but vim does not, which is why .vimrc declares the
# two families separately.
bind -n M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind -n M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'

# -- cycle panes, the guaranteed way out ---------------------------------------------
# Alt-Tab cycles tmux panes, forward and back, and wraps.  Two jobs:
#
#   1. Consistency with Cmd-Tab.  Cmd/Super-Tab switches applications at the OS level on
#      both platforms; Alt-Tab is the same gesture one layer in, switching panes inside
#      the terminal, exactly as Alt is the in-terminal modifier everywhere else here.
#      On Linux that requires taking Alt-Tab back from GNOME, which
#      keyboard/linux/terminal.sh does by pinning switch-applications to Super-Tab only.
#
#   2. It is the escape hatch.  Unlike M-h/j/k/l this is deliberately NOT wrapped in the
#      is_vim test, so it is never forwarded to the running program.  M-h/j/k/l inside
#      vim depends on vim cooperating (see .vimrc); if vim is old, unconfigured, or the
#      pane is running something else that swallows Alt keys, this still moves.  There is
#      no state in which focus can be stuck in a pane.
#
# Back-tab has two encodings in the wild: ESC + CSI Z, which tmux calls M-BTab (kitty,
# gnome-terminal, iTerm2 with Option as Esc+), and the CSI modifier form, which it calls
# M-S-Tab.  Both are bound; whichever the terminal sends, the key works.
bind -n M-Tab   select-pane -t :.+
bind -n M-BTab  select-pane -t :.-
bind -n M-S-Tab select-pane -t :.-

# -- resize, shared with vim splits --------------------------------------------------
# Alt-Shift is resize, in the same four directions and with the same vim passthrough, so
# focus and resize differ only by the Shift key.  Both key families again, and again in
# two encodings: Alt-Shift+letter is ESC + the capital, Alt-Shift+Arrow is the CSI form
# with modifier 4.
#
# Directions agree with vim's own: -L/-R narrow/widen, -U/-D shorten/lengthen, matching
# <C-w>< , <C-w>> , <C-w>- and <C-w>+ respectively.
bind -n M-H if-shell "$is_vim" 'send-keys M-H' 'resize-pane -L 2'
bind -n M-J if-shell "$is_vim" 'send-keys M-J' 'resize-pane -D 2'
bind -n M-K if-shell "$is_vim" 'send-keys M-K' 'resize-pane -U 2'
bind -n M-L if-shell "$is_vim" 'send-keys M-L' 'resize-pane -R 2'

bind -n M-S-Left  if-shell "$is_vim" 'send-keys M-S-Left'  'resize-pane -L 2'
bind -n M-S-Down  if-shell "$is_vim" 'send-keys M-S-Down'  'resize-pane -D 2'
bind -n M-S-Up    if-shell "$is_vim" 'send-keys M-S-Up'    'resize-pane -U 2'
bind -n M-S-Right if-shell "$is_vim" 'send-keys M-S-Right' 'resize-pane -R 2'

# -- paging --------------------------------------------------------------------------
# PageUp enters scrollback directly.  The default is prefix-only (C-x PageUp), which is
# exactly the chaining this config exists to remove -- and scrollback is not a rare
# operation.
#
# Only PageUp is bound at the root.  PageDown is deliberately left unbound so it falls
# through to the running program: outside copy-mode there is nothing below the live
# pane to page down to, and inside copy-mode tmux's own default already handles it.
#
# The test is NOT the is_vim check used above: anything that pages its own content --
# less, man, top, vim -- must receive the key, and only a plain shell pane should be
# diverted into tmux scrollback.  Matching on vim alone would break PageUp in less and
# man, which is most of what actually gets paged.
#
# '#{alternate_on}' catches full-screen programs, but is not sufficient on its own here:
# .shell/.common.d/home.sh exports LESS="-EXFR", and that -X keeps less on the normal
# screen, so less never sets the alternate-screen flag.  Hence the second test on the
# command name.
pager_active="#{||:#{alternate_on},#{m/r:^(vim|vimx|nvim|view|less|more|most|man|top|htop|watch|git)$,#{pane_current_command}}}"
bind -n PPage if-shell -F "$pager_active" 'send-keys PPage' 'copy-mode -u'

# Ctrl-Home / Ctrl-End jump to the ends of the scrollback, matching vim's gg / G, which is
# what those keys already do there.  tmux binds plain Home/End in copy-mode by default but
# not the Ctrl pair, so without this the two layers disagree on one key out of six.
#
# Both mode tables: mode-keys follows $EDITOR, so a box without vim lands in copy-mode
# rather than copy-mode-vi and would otherwise miss these.
bind -T copy-mode-vi C-Home send-keys -X history-top
bind -T copy-mode-vi C-End  send-keys -X history-bottom
bind -T copy-mode    C-Home send-keys -X history-top
bind -T copy-mode    C-End  send-keys -X history-bottom

# Ctrl-Left / Ctrl-Right move by word, matching vim's b / w and the shells' backward-word /
# forward-word.  Unbound in copy-mode by default, so this was the last key in the set where
# the layers disagreed.  Delete deliberately gets nothing here: copy-mode is read-only, so
# the key has no meaning to give it.
bind -T copy-mode-vi C-Left  send-keys -X previous-word
bind -T copy-mode-vi C-Right send-keys -X next-word
bind -T copy-mode    C-Left  send-keys -X previous-word
bind -T copy-mode    C-Right send-keys -X next-word

# -- copy and paste ------------------------------------------------------------------
# tmux is deliberately NOT in the copy path.  The terminal emulator owns copy, vim owns
# copy inside vim, and nothing in between.
#
# The reason is gnome-terminal, which is a required target: VTE has never implemented
# OSC 52 and has no setting to enable it.  OSC 52 is the only escape sequence a program
# inside a pane can use to reach the system clipboard, so on the one Linux terminal that
# must work, tmux physically cannot put anything on the clipboard.  Everything built on
# top of it -- copy-pipe bindings, mouse-drag copy, click-to-copy -- was dead weight there
# and only ever worked on the other terminals.  Piping to xclip/wl-copy instead would
# work locally and fail over ssh, which is the case tmux exists for.
#
# So copy is the terminal's, on every platform, with one gesture and one modifier:
#
#   drag             select        every terminal (mouse reporting is off, below)
#   Cmd-C / Super-C  copy          every terminal, all three desktops
#   Cmd-V / Super-V  paste         every terminal, all three desktops
#
# Cmd on macOS and Super on Linux are the same physical key, left of the space bar.  See
# keyboard/linux/terminal.sh, which moves gnome-terminal, alacritty, kitty and xterm onto
# Super and releases the GNOME Shell grabs that would otherwise eat Super-A/N/V.
#
# The terminal selects out of the glyphs on screen, so the selection is screen-rectangular
# rather than pane-aware -- a drag across a vertical split picks up the neighbour's text on
# those rows -- and it can only reach what is currently displayed.  Both are accepted; see
# keyboard/README.md.  While Alt-m has mouse reporting on, hold Shift (Option in iTerm2)
# to suppress it for the length of the drag and get the same terminal selection.
#
# tmux's own copy-mode still exists for scrollback the mouse cannot reach.  It copies to
# tmux's paste buffer, not the system clipboard, and C-x ] pastes it back.  Its default
# bindings are left exactly as tmux ships them.
#
# Paste needs no binding at all: Cmd-V / Super-V is the terminal writing bytes into
# the tty, which every layer already reads.  What it needs is bracketed paste, so the
# receiving program knows the bytes are a paste and not typing -- without it vim
# auto-indents each line into a staircase.  tmux passes the mode through and vim enables
# it from terminfo, so both work as shipped.
bind ] paste-buffer -p

# Selection highlight for copy-mode, kept identical to vim's Visual in .vimrc.  Numbers
# rather than names: tmux's 'blue' is colour4 and vim's 'Blue' is colour12, so the two
# configs can name the same colour and get different ones.  See the matching note in .vimrc.
set -g mode-style "bg=colour4,fg=colour15"

# Allows for faster key repetition.  Also required for Alt bindings: tmux must not wait
# to decide whether an ESC is a lone Escape or the prefix of a Meta key.
set -s escape-time 0

