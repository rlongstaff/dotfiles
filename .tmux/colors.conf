# GENERATED from colors.yaml by scripts/colors/render.sh. Edit the yaml, not this file.
# Sourced by .tmux.conf.  Restart tmux (tmux kill-server) after a change.

set -g status-style "fg=color7,bg=#003366"

# user option: status-right in .tmux.conf reads #{@status-clock-fg}
set -g @status-clock-fg "color2"

# user option: matches status-style bg above; the alt+x binding in keys.yaml restores this explicitly rather than unsetting status-style, since unset would fall back to tmux's compiled-in default (green) rather than this value
set -g @status-normal-bg "#003366"

# user option: the alt+x binding in keys.yaml reads #{@status-passthrough-bg}
set -g @status-passthrough-bg "color9"

# matches vim's Visual
set -g mode-style "fg=color15,bg=color4"
