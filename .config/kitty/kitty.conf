# kitty.  The whole directory is linked to ~/.config/kitty (LINKS in scripts/lib.sh).
# Only settings that differ from kitty's defaults live here; `kitty +runpy
# 'from kitty.config import *'` or https://sw.kovidgoyal.net/kitty/conf/ has the rest.

# Key bindings come from scripts/keyboard/keys.yaml, rendered by scripts/keyboard/render.sh.
# Super (Cmd on macOS) is the terminal's modifier; Alt is left to tmux and vim.
include keys.conf

# -- bell ------------------------------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    #606060
bell_on_tab          "🔔 "

# -- window ----------------------------------------------------------------------------
remember_window_size   yes
resize_in_steps        no
wayland_titlebar_color system

# -- misc ------------------------------------------------------------------------------
allow_hyperlinks yes
