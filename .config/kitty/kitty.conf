# Linked to ~/.config/kitty/kitty.conf by dotfiles (scripts/lib.sh LINKS).
# Keyboard standard: Super owns copy/paste/tabs/windows, Alt is left to tmux and vim.
# See scripts/keyboard/README.md.

# Copy/paste with Cmd/Super+C and Cmd/Super+V
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Example: Cmd/Super+N for new window
map cmd+n new_window
map super+n new_window

# Example: Cmd/Super+T for new tab
map cmd+t new_tab
map super+t new_tab

# map super+w close_tab
